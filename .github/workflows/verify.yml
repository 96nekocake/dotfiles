name: Config checks

on:
  pull_request:
    branches: [wip]

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check syntax and isolated tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy.sh
          zsh -n .zshrc
          for file in zsh/*.zsh; do zsh -n "$file"; done
          # Only shell integration tests belong in this job; Neovim has its own smoke job.
          for test_file in tests/deploy-test.sh tests/shell-tools-test.sh tests/zsh-startup-test.sh; do
            [[ -f "$test_file" ]] || continue
            bash "$test_file"
          done

  nvim-lua:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check Neovim Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luajit -b "$file" /dev/null
          done < <(find nvim -type f -name '*.lua' -print0)
