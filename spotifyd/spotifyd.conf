[global]
# Spotifyd 0.4+ authenticates with OAuth, not a username or password here.
# Run `spotifyd authenticate` after deployment. Its credentials stay in the
# default cache directory outside this checkout; do not set cache_path to ~ or $HOME.
# Select an audio backend for the host with --backend if the default is unsuitable.
device_name = "nekocake"
device_type = "computer"
bitrate = 320
no_audio_cache = false
volume_normalisation = true
normalisation_pregain = -10
